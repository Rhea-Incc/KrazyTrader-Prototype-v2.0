name: Publish Android OTA update

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/krazytrader/app/**"
      - "artifacts/krazytrader/assets/**"
      - "artifacts/krazytrader/components/**"
      - "artifacts/krazytrader/constants/**"
      - "artifacts/krazytrader/context/**"
      - "artifacts/krazytrader/data/**"
      - "artifacts/krazytrader/hooks/**"
      - "artifacts/krazytrader/types/**"
      - "artifacts/krazytrader/utils/**"
      - "lib/api-client-react/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ota-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Publish to EAS Update
        working-directory: artifacts/krazytrader
        env:
          CI: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: GitHub ${{ github.sha }}
        run: >-
          pnpm dlx eas-cli@27.7.2 update
          --channel preview
          --platform android
          --environment preview
          --message "$UPDATE_MESSAGE"
