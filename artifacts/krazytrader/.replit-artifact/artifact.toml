kind = "mobile"
previewPath = "/"
title = "KrazyTrader"
description = "An Android-oriented demonstration app establishing the brand, navigation, reusable interface, and fictional data foundation for a Kenyan rider membership platform."
version = "1.0.0"
id = "artifacts/krazytrader"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25363

[services.development]
run = "pnpm --filter @workspace/krazytrader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/krazytrader", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/krazytrader", "run", "serve" ]

[services.env]
PORT = "25363"
BASE_PATH = "/"
